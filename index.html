<!DOCTYPE html>
<html lang="zh-HK" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="多功能計數機：BMI、按揭、聚會分帳、超市購物、壽司朗" />
  <title>多功能計數機</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="stylesheet" href="./tailwind.css" />
  <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    html, body { overscroll-behavior: none; height: 100%; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .panel {
      overscroll-behavior: contain;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    #viewport {
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }
    #track {
      touch-action: pan-y;
    }
    .swiping { user-select: none; -webkit-user-select: none; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .card { background: white; border-radius: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04); border: 1px solid #f1f5f9; }
    .btn-soft-minus { background: #f1f5f9; color: #64748b; }
    .btn-soft-plus { background: #fff1f2; color: #e11d48; }
    .btn-soft-minus:active, .btn-soft-plus:active { transform: scale(0.96); }
    html #app { height: 100vh; height: 100dvh; }
    html .text-slate-400 { color: #64748b; }
    html .text-slate-300 { color: #94a3b8; }
    .hscroll { touch-action: pan-x pan-y; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased">
  <div id="app" class="h-full flex flex-col max-w-lg mx-auto relative bg-slate-50">

    <header id="topbar" class="px-4 py-3 flex items-center justify-between sticky top-0 z-30 shrink-0 bg-white border-b border-slate-100 shadow-sm">
      <div class="flex items-center gap-2.5">
        <div id="hdr-icon" class="w-9 h-9 rounded-xl bg-rose-500 flex items-center justify-center shadow-sm">
          <i data-lucide="activity" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 id="hdr-title" class="text-base font-bold text-slate-800 leading-tight">BMI & 熱量</h1>
          <p class="text-[10px] text-slate-400">左右滑動切換 · 五合一計數機</p>
        </div>
      </div>
      <button id="btn-reset" class="flex items-center text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full transition active:scale-95 font-medium" aria-label="重設目前計數機">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 mr-1"></i> 重設
      </button>
    </header>

    <div id="viewport" class="flex-1 overflow-hidden relative">
      <div id="track" class="flex h-full" style="transform: translateX(0)">
      </div>
    </div>

    <nav class="bg-white border-t border-slate-100 px-1 py-2 flex justify-around items-center shrink-0 z-30 safe-bottom shadow-[0_-2px_10px_rgba(0,0,0,0.04)]" role="tablist" aria-label="計數機切換">
    </nav>
  </div>

<script>
(function () {
  'use strict';

  const CALCS = [
    { id: 'bmi', name: 'BMI & 熱量', short: 'BMI', icon: 'activity', accent: 'text-rose-500', bg: 'bg-rose-500' },
    { id: 'mortgage', name: '按揭計數機', short: '按揭', icon: 'home', accent: 'text-blue-500', bg: 'bg-blue-500' },
    { id: 'party', name: '聚會分帳', short: '分帳', icon: 'party-popper', accent: 'text-indigo-500', bg: 'bg-indigo-500' },
    { id: 'supermarket', name: '超市購物', short: '超市', icon: 'shopping-cart', accent: 'text-emerald-500', bg: 'bg-emerald-500' },
    { id: 'sushiro', name: '壽司朗', short: '壽司', icon: 'utensils', accent: 'text-orange-500', bg: 'bg-orange-500' },
  ];

  // BMI bar segments: [min, max, widthPercent]
  const BMI_SEGMENTS = [
    { min: 0, max: 18.5, width: 20, label: '過輕', color: 'bg-blue-300' },
    { min: 18.5, max: 24, width: 30, label: '適中', color: 'bg-emerald-400' },
    { min: 24, max: 28, width: 25, label: '過重', color: 'bg-amber-300' },
    { min: 28, max: 40, width: 25, label: '肥胖', color: 'bg-red-400' },
  ];

  let idx = 0, startX = 0, startY = 0, currX = 0, dragging = false, panelW = 0, locked = null;
  const $ = id => document.getElementById(id);
  const val = (id, def = 0) => parseFloat($(id)?.value) || def;
  const txt = (id, v) => { if ($(id)) $(id).textContent = v; };
  const round1 = n => Math.round(n * 10) / 10;
  const money = n => round1(n).toFixed(1);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const lsGet = (k, def) => { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch { return def; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch {} };

  function buildShell() {
    const track = $('track');
    const nav = document.querySelector('nav');
    track.innerHTML = CALCS.map((c, i) => `
      <div class="panel w-full h-full shrink-0 overflow-y-auto bg-slate-50" data-i="${i}" id="panel-${c.id}" role="tabpanel">
        <div class="p-4 pb-8 min-h-full" id="content-${c.id}"></div>
      </div>`).join('');
    nav.innerHTML = CALCS.map((c, i) => `
      <button class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl min-w-[56px] transition ${i===0?'bg-slate-100':''}" data-i="${i}" role="tab" aria-selected="${i===0}" aria-label="${c.name}">
        <i data-lucide="${c.icon}" class="w-5 h-5 ${i===0?c.accent:'text-slate-400'}"></i>
        <span class="text-[10px] font-medium ${i===0?'text-slate-800':'text-slate-400'}">${c.short}</span>
      </button>`).join('');
    if (window.lucide) lucide.createIcons();
    setupSwipe();
    setupNav();
    $('btn-reset').onclick = () => window.dispatchEvent(new CustomEvent('reset-calc', { detail: { id: CALCS[idx].id } }));
  }

  let trackX = 0, wcTimer = null;
  function setTrack(x, anim) {
    const t = $('track');
    clearTimeout(wcTimer);
    if (anim && x !== trackX) {
      t.style.willChange = 'transform';
      t.style.transition = 'transform .22s cubic-bezier(0.2, 0.0, 0.0, 1)';
      wcTimer = setTimeout(() => { t.style.willChange = 'auto'; t.style.transition = 'none'; }, 280);
    } else {
      t.style.transition = 'none';
      t.style.willChange = 'auto';
    }
    t.style.transform = `translateX(${x}px)`;
    trackX = x;
  }

  function goTo(i, anim = true) {
    if (i < 0 || i >= CALCS.length) return;
    idx = i;
    panelW = $('viewport').clientWidth;
    currX = -i * panelW;
    setTrack(currX, anim);
    updateHeader();
  }

  function updateHeader() {
    const c = CALCS[idx];
    document.querySelectorAll('.panel').forEach((p, i) => { p.inert = i !== idx; p.setAttribute('aria-hidden', String(i !== idx)); });
    $('hdr-title').textContent = c.name;
    const icon = $('hdr-icon');
    icon.className = `w-9 h-9 rounded-xl ${c.bg} flex items-center justify-center shadow-sm`;
    icon.innerHTML = `<i data-lucide="${c.icon}" class="w-5 h-5 text-white"></i>`;
    document.querySelectorAll('.nav-btn').forEach((b, i) => {
      const ic = b.querySelector('svg, i'), sp = b.querySelector('span');
      if (i === idx) {
        b.classList.add('bg-slate-100');
        b.setAttribute('aria-selected', 'true');
        ic.setAttribute('class', `w-5 h-5 ${c.accent}`);
        sp.className = 'text-[10px] font-medium text-slate-800';
      } else {
        b.classList.remove('bg-slate-100');
        b.setAttribute('aria-selected', 'false');
        ic.setAttribute('class', 'w-5 h-5 text-slate-400');
        sp.className = 'text-[10px] font-medium text-slate-400';
      }
    });
    if (window.lucide) lucide.createIcons();
  }

  // ========== Swipe: direction lock + velocity; will-change only while dragging ==========
  let lastMoveX = 0, lastMoveT = 0, velocityX = 0;

  function setupSwipe() {
    const vp = $('viewport');
    const track = $('track');

    const onStart = (x, y) => {
      dragging = true;
      startX = x; startY = y; lastMoveX = x;
      lastMoveT = performance.now();
      velocityX = 0; locked = null;
      panelW = vp.clientWidth;
    };

    const onMove = (x, y, e) => {
      if (!dragging) return;
      const dx = x - startX, dy = y - startY;
      const now = performance.now(), dt = now - lastMoveT;
      if (dt > 0) velocityX = velocityX * 0.6 + ((x - lastMoveX) / dt) * 0.4;
      lastMoveX = x; lastMoveT = now;

      if (!locked && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
        locked = Math.abs(dx) > Math.abs(dy) * 1.15 ? 'h' : 'v';
        if (locked === 'h') {
          clearTimeout(wcTimer);
          track.style.transition = 'none';
          track.style.willChange = 'transform';
          document.body.classList.add('swiping');
        }
      }
      if (locked !== 'h') return;
      if (e && e.cancelable) e.preventDefault();

      let d = dx;
      if (idx === 0 && d > 0) d = 0;
      if (idx === CALCS.length - 1 && d < 0) d = 0;
      trackX = currX + d;
      track.style.transform = `translateX(${trackX}px)`;
    };

    const mouseMove = e => onMove(e.clientX, e.clientY, null);
    const mouseUp = e => onEnd(e.clientX);

    const endDrag = () => {
      dragging = false;
      document.body.classList.remove('swiping');
      window.removeEventListener('mousemove', mouseMove);
      window.removeEventListener('mouseup', mouseUp);
    };

    const onEnd = (x) => {
      if (!dragging) return;
      const wasH = locked === 'h';
      const d = x - startX;
      const v = velocityX;
      endDrag();
      locked = null; velocityX = 0;
      if (!wasH) return;  // vertical scroll / tap: track never moved, nothing to restore

      const th = panelW * 0.18;
      if ((d < -th || v < -0.35) && idx < CALCS.length - 1) goTo(idx + 1, true);
      else if ((d > th || v > 0.35) && idx > 0) goTo(idx - 1, true);
      else goTo(idx, true);
    };

    vp.addEventListener('touchstart', e => {
      // let horizontally scrollable areas (e.g. mortgage table) handle their own touches
      if (e.touches.length > 1 || e.target.closest('.hscroll')) return;
      const t = e.touches[0];
      onStart(t.clientX, t.clientY);
    }, { passive: true });
    vp.addEventListener('touchmove', e => { const t = e.touches[0]; onMove(t.clientX, t.clientY, e); }, { passive: false });
    vp.addEventListener('touchend', e => onEnd(e.changedTouches[0].clientX), { passive: true });
    vp.addEventListener('touchcancel', () => {
      if (!dragging) return;
      const wasH = locked === 'h';
      endDrag(); locked = null; velocityX = 0;
      if (wasH) goTo(idx, true);
    }, { passive: true });

    // Mouse: window listeners only exist during a drag
    vp.addEventListener('mousedown', e => {
      if (e.button !== 0 || e.target.closest('input, select, button, textarea, a, label, .hscroll')) return;
      e.preventDefault();
      onStart(e.clientX, e.clientY);
      window.addEventListener('mousemove', mouseMove);
      window.addEventListener('mouseup', mouseUp);
    });

    // keyboard focus must never scroll the (overflow:hidden) viewport sideways
    vp.addEventListener('scroll', () => { vp.scrollLeft = 0; });
    window.addEventListener('resize', () => goTo(idx, false));
  }

  function setupNav() {
    document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => goTo(+b.dataset.i)));
  }

  // ========== 1. BMI ==========
  function initBMI() {
    const el = $('content-bmi');
    el.innerHTML = `
      <div class="space-y-4">
        <div class="bg-white p-1 rounded-2xl flex text-xs font-bold border border-slate-100 shadow-sm">
          <button id="bmi-metric" class="flex-1 py-2.5 rounded-xl bg-rose-50 text-rose-600 shadow-sm">公制 (cm/kg)</button>
          <button id="bmi-imperial" class="flex-1 py-2.5 rounded-xl text-slate-400">英制 (ft+in/lbs)</button>
        </div>
        <section class="card p-4 space-y-4">
          <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5"><i data-lucide="user-check" class="w-4 h-4 text-rose-500"></i>個人資料</h2>
          <div class="grid grid-cols-2 gap-2 text-sm font-semibold">
            <button id="bmi-male" class="py-2.5 rounded-xl border-2 border-rose-400 bg-rose-50 text-rose-600 flex items-center justify-center gap-1"><i data-lucide="mars" class="w-4 h-4"></i>男士</button>
            <button id="bmi-female" class="py-2.5 rounded-xl border border-slate-200 bg-white text-slate-500 flex items-center justify-center gap-1"><i data-lucide="venus" class="w-4 h-4"></i>女士</button>
          </div>
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div><label class="block text-slate-500 mb-1 font-medium">年齡</label><input type="number" id="bmi-age" value="28" min="10" max="120" inputmode="numeric" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:ring-2 focus:ring-rose-400 outline-none"></div>
            <div id="bmi-h-metric"><label class="block text-slate-500 mb-1 font-medium">身高 (cm)</label><input type="number" id="bmi-hcm" value="172" inputmode="decimal" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:ring-2 focus:ring-rose-400 outline-none"></div>
            <div id="bmi-h-imp" class="hidden col-span-2 grid grid-cols-2 gap-2">
              <div><label class="block text-slate-500 mb-1 font-medium">呎</label><input type="number" id="bmi-hft" value="5" inputmode="numeric" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 outline-none"></div>
              <div><label class="block text-slate-500 mb-1 font-medium">吋</label><input type="number" id="bmi-hin" value="8" inputmode="numeric" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 outline-none"></div>
            </div>
            <div id="bmi-w-metric" class="col-span-2"><label class="block text-slate-500 mb-1 font-medium">體重 (kg)</label><input type="number" id="bmi-wkg" value="68" step="0.5" inputmode="decimal" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:ring-2 focus:ring-rose-400 outline-none"></div>
            <div id="bmi-w-imp" class="col-span-2 hidden"><label class="block text-slate-500 mb-1 font-medium">體重 (lbs)</label><input type="number" id="bmi-wlbs" value="150" inputmode="decimal" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 outline-none"></div>
          </div>
          <div>
            <label class="block text-slate-500 mb-1 text-xs font-medium flex items-center gap-1"><i data-lucide="flame" class="w-3.5 h-3.5 text-rose-500"></i>活動量</label>
            <select id="bmi-act" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none">
              <option value="1.2">久坐</option>
              <option value="1.375" selected>輕度 (1-3天/週)</option>
              <option value="1.55">中度 (3-5天)</option>
              <option value="1.725">高度 (6-7天)</option>
              <option value="1.9">極高強度</option>
            </select>
          </div>
        </section>
        <section class="bg-gradient-to-br from-rose-500 to-pink-600 text-white p-5 rounded-2xl shadow-lg space-y-3">
          <div class="flex justify-between">
            <div><span class="text-xs text-rose-100 uppercase font-semibold">BMI</span><div class="text-4xl font-black mt-1" id="bmi-val">23.0</div></div>
            <div class="bg-white/15 px-3 py-1.5 rounded-xl text-right backdrop-blur-sm"><span class="text-xs text-rose-100 block">狀態</span><span id="bmi-st" class="text-sm font-bold">適中</span></div>
          </div>
          <div class="relative pt-1">
            <div class="w-full bg-black/20 rounded-full h-2.5 flex overflow-hidden">
              ${BMI_SEGMENTS.map(g => `<div class="${g.color}" style="width:${g.width}%"></div>`).join('')}
            </div>
            <div id="bmi-ptr" class="absolute -top-0.5 -translate-x-1/2 transition-all" style="left:40%"><div class="w-0 h-0 border-l-[5px] border-r-[5px] border-b-[6px] border-l-transparent border-r-transparent border-b-white"></div></div>
          </div>
          <div class="flex justify-between text-xs text-rose-100 pt-1 border-t border-white/20"><span>理想體重</span><span id="bmi-ideal" class="font-bold">54.7 - 70.7 kg</span></div>
        </section>
        <section class="card p-4 space-y-3">
          <h2 class="text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i>熱量分析</h2>
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="bg-amber-50 p-3 rounded-xl border border-amber-100"><span class="text-amber-700 font-semibold block">BMR</span><span id="bmi-bmr" class="text-xl font-extrabold text-amber-900">1,620</span><span class="text-[10px] text-amber-600/80 block">kcal/日</span></div>
            <div class="bg-rose-50 p-3 rounded-xl border border-rose-100"><span class="text-rose-700 font-semibold block">TDEE</span><span id="bmi-tdee" class="text-xl font-extrabold text-rose-900">2,228</span><span class="text-[10px] text-rose-600/80 block">kcal/日</span></div>
          </div>
        </section>
        <section class="card p-4 space-y-2">
          <h2 class="text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5 mb-2"><i data-lucide="target" class="w-4 h-4 text-rose-500"></i>每日建議</h2>
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between text-xs"><div><span class="font-bold text-slate-700 block">溫和減脂</span><span class="text-slate-400">TDEE-15%</span></div><span id="bmi-g1" class="font-extrabold text-emerald-600 text-base">1,894</span></div>
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between text-xs"><div><span class="font-bold text-slate-700 block">增肌</span><span class="text-slate-400">TDEE+10%</span></div><span id="bmi-g2" class="font-extrabold text-blue-600 text-base">2,450</span></div>
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between text-xs"><div><span class="font-bold text-slate-700 block">快速減脂</span><span class="text-slate-400">TDEE-25%</span></div><span id="bmi-g3" class="font-extrabold text-amber-600 text-base">1,671</span></div>
        </section>
        <section class="card overflow-hidden">
          <div class="bg-slate-50 px-4 py-2.5 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5"><i data-lucide="pie-chart" class="w-4 h-4 text-rose-500"></i>營養素 (TDEE基準)</div>
          <div class="p-3 grid grid-cols-3 gap-2 text-center text-xs">
            <div class="bg-rose-50 p-2 rounded-xl border border-rose-100"><span class="text-slate-500 block text-[11px]">蛋白質30%</span><span id="bmi-mp" class="font-extrabold text-rose-600">167g</span></div>
            <div class="bg-amber-50 p-2 rounded-xl border border-amber-100"><span class="text-slate-500 block text-[11px]">碳水40%</span><span id="bmi-mc" class="font-extrabold text-amber-600">222g</span></div>
            <div class="bg-blue-50 p-2 rounded-xl border border-blue-100"><span class="text-slate-500 block text-[11px]">脂肪30%</span><span id="bmi-mf" class="font-extrabold text-blue-600">74g</span></div>
          </div>
        </section>
      </div>`;
    if (window.lucide) lucide.createIcons();

    let metric = true, gender = 'male';

    // Pointer position aligned with segment widths
    function bmiPointerPercent(bmi) {
      let offset = 0;
      for (const seg of BMI_SEGMENTS) {
        if (bmi <= seg.max || seg === BMI_SEGMENTS[BMI_SEGMENTS.length - 1]) {
          const span = seg.max - seg.min;
          const t = Math.min(1, Math.max(0, (bmi - seg.min) / span));
          return offset + t * seg.width;
        }
        offset += seg.width;
      }
      return 95;
    }

    const calc = () => {
      let h = 0, w = 0;
      if (metric) { h = val('bmi-hcm'); w = val('bmi-wkg'); }
      else { h = (val('bmi-hft') * 12 + val('bmi-hin')) * 2.54; w = val('bmi-wlbs') * 0.453592; }
      const age = val('bmi-age', 25), act = val('bmi-act', 1.2);
      if (h <= 0 || w <= 0) return;
      const hm = h / 100, bmi = w / (hm * hm);
      txt('bmi-val', bmi.toFixed(1));
      let st = '肥胖';
      if (bmi < 18.5) st = '過輕';
      else if (bmi < 24) st = '適中';

      // MIP shown separately as estimate only

        const d = document.createElement('div');
        d.className = 'flex justify-between items-center bg-white px-3 py-1.5 rounded-lg border border-emerald-100';
        d.innerHTML = `<span class="font-medium text-slate-600">${esc(m)}</span>${Math.abs(b) < 0.05 ? '<span class="text-slate-400">$0</span>' : b > 0 ? `<span class="text-emerald-600 font-bold">應收回 +$${money(b)}</span>` : `<span class="text-red-500 font-bold">應支付 -$${money(Math.abs(b))}</span>`}`;
        bl.appendChild(d);
      });
      const debt = [], cred = [];
      Object.keys(bals).forEach(m => {
        const b = bals[m];
        if (b < -0.05) debt.push({ n: m, a: -b });
        else if (b > 0.05) cred.push({ n: m, a: b });
      });
      debt.sort((x, y) => y.a - x.a); cred.sort((x, y) => y.a - x.a);
      const trans = []; let i = 0, j = 0;
      while (i < debt.length && j < cred.length) {
        const a = Math.min(debt[i].a, cred[j].a);
        trans.push({ f: debt[i].n, t: cred[j].n, a: round1(a) });
        debt[i].a = round1(debt[i].a - a); cred[j].a = round1(cred[j].a - a);
        if (debt[i].a < 0.05) i++;
        if (cred[j].a < 0.05) j++;
      }
      lastTransfers = trans;
      const tl = $('pty-trans'); tl.innerHTML = '';
      if (!trans.length) tl.innerHTML = '<div class="bg-white p-3 rounded-xl border border-emerald-100 text-center text-slate-400 text-xs">帳目平衡</div>';
      else {
        trans.forEach(t => {
          const c = document.createElement('div');
          c.className = 'bg-white p-3 rounded-xl border border-emerald-200 flex items-center justify-between shadow-sm';
          c.innerHTML = `<div class="flex items-center gap-2"><span class="font-bold text-red-500">${esc(t.f)}</span><i data-lucide="arrow-right" class="w-4 h-4 text-slate-300"></i><span class="font-bold text-emerald-600">${esc(t.t)}</span></div><span class="font-black text-slate-800">$${money(t.a)}</span>`;
          tl.appendChild(c);
        });
        if (window.lucide) lucide.createIcons();
      }
    }

    function renderAll() { renderMembers(); renderExps(); settle(); }

    function buildCopyText() {
      const tot = expenses.reduce((s, e) => s + e.amount, 0);
      let t = `🎉 Party 結帳紀錄\n----------------------\n總花費: $${money(tot)}\n\n`;
      t += `【轉帳指示】\n`;
      if (!lastTransfers.length) {
        t += `帳目已平衡，無須轉帳\n`;
      } else {
        lastTransfers.forEach(tr => {
          t += `${tr.f} ➡️ ${tr.t} : $${money(tr.a)}\n`;
        });
      }
      t += `\n（由多功能計數機產生）`;
      return t;
    }

    $('pty-fm').onsubmit = e => {
      e.preventDefault();
      const n = $('pty-name').value.trim();
      if (n && !members.includes(n)) { members.push(n); save(); renderAll(); $('pty-name').value = ''; }
    };
    $('pty-mode').onchange = e => $('pty-cbs-wrap').classList.toggle('hidden', e.target.value !== 'CUSTOM');
    $('pty-ef').onsubmit = e => {
      e.preventDefault();
      const title = $('pty-title').value, amount = parseFloat($('pty-amt').value), payer = $('pty-payer').value;
      const mode = $('pty-mode').value;
      let parts = mode === 'ALL' ? [...members] : [...document.querySelectorAll('.pty-cb:checked')].map(c => c.value);
      if (!payer || !parts.length || isNaN(amount) || amount <= 0) return;
      expenses.unshift({ id: Date.now().toString(), title, amount: round1(amount), payer, participants: parts });
      save(); renderAll();
      $('pty-title').value = ''; $('pty-amt').value = '';
    };
    $('pty-copy').onclick = async () => {
      const text = buildCopyText();
      try {
        await navigator.clipboard.writeText(text);
        const btn = $('pty-copy');
        const old = btn.innerHTML;
        btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i> 已複製';
        if (window.lucide) lucide.createIcons();
        setTimeout(() => { btn.innerHTML = old; if (window.lucide) lucide.createIcons(); }, 1800);
      } catch {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('已複製結帳結果');
      }
    };
    window.addEventListener('reset-calc', e => {
      if (e.detail.id === 'party') { members = ['阿Dave','May','Ben']; expenses = []; save(); renderAll(); }
    });
    renderAll();
  }

    function renderGrid() {
      const g = $('su-grid'); g.innerHTML = '';
      plates.forEach(p => {
        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between space-y-3';
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl ${p.color || 'bg-red-400'} flex items-center justify-center text-lg shadow-inner text-white">${p.icon || '🍣'}</div>
              <div>
                <h3 class="font-bold text-slate-700 text-sm leading-snug">${esc(p.name)}</h3>
                <span class="font-extrabold text-red-500 text-sm">$${p.price}</span>
              </div>
            </div>
            <span class="text-xs font-bold text-slate-400 bg-slate-50 px-2.5 py-1 rounded-lg" data-count="${p.id}">${p.count} 份</span>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" class="su-m flex-1 py-2.5 rounded-xl font-extrabold text-lg btn-soft-minus active:scale-95 transition" data-id="${p.id}" aria-label="減少 ${p.name}">−</button>
            <div class="w-14 py-2 bg-slate-50 border border-slate-100 rounded-xl text-center font-extrabold text-slate-800 text-base" data-num="${p.id}">${p.count}</div>
            <button type="button" class="su-p flex-1 py-2.5 rounded-xl font-extrabold text-lg btn-soft-plus active:scale-95 transition" data-id="${p.id}" aria-label="增加 ${p.name}">+</button>
          </div>`;
        card.querySelector('.su-p').onclick = () => { p.count++; saveP(); updatePlateUI(p); calcAndSum(); };
        card.querySelector('.su-m').onclick = () => { p.count = Math.max(0, p.count - 1); clampDishes(p); saveP(); saveD(); updatePlateUI(p); renderDishes(); calcAndSum(); };
        g.appendChild(card);
      });
    }

    function updatePlateUI(p) {
      const num = document.querySelector(`[data-num="${p.id}"]`);
      const cnt = document.querySelector(`[data-count="${p.id}"]`);
      if (num) num.textContent = p.count;
      if (cnt) cnt.textContent = p.count + ' 份';
    }

    function renderDishes() {
      const cont = $('su-dishes'), sel = $('su-dplate');
      cont.innerHTML = ''; sel.innerHTML = '';
      plates.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = `${p.name} ($${p.price})`; sel.appendChild(o); });
      dishes.forEach(d => {
        const tp = plates.find(p => p.id === d.plateId);
        const price = tp ? tp.price : 0;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'flex items-center gap-1.5 bg-slate-50 hover:bg-orange-50 border border-slate-100 hover:border-orange-200 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 transition active:scale-95 shadow-sm';
        const badge = d.count > 0 ? `<span class="bg-orange-100 text-orange-600 px-1.5 rounded-md text-[10px] font-bold">${d.count}</span>` : '';
        btn.innerHTML = `<span>${esc(d.icon || '🍣')}</span><span>${esc(d.name)}</span><span class="text-red-500 font-bold">($${price})</span>${badge}`;
        btn.onclick = () => {
          if (tp) {
            tp.count++;
            d.count = (d.count || 0) + 1;
            saveP(); saveD();
            updatePlateUI(tp);
            renderDishes();
            calcAndSum();
          }
        };
        cont.appendChild(btn);
      });
    }

    function renderSum() {
      const list = $('su-sum'); list.innerHTML = '';
      const selPlates = plates.filter(p => p.count > 0);
      const selDishes = dishes.filter(d => d.count > 0);
      const totC = plates.reduce((s, p) => s + p.count, 0);
      $('su-badge').textContent = `共 ${totC} 份`;
      if ($('su-badge-top')) $('su-badge-top').textContent = totC;

      if (!selPlates.length && !selDishes.length) {
        list.innerHTML = '<li class="p-4 text-center text-slate-400 text-xs">尚未記錄任何盤數</li>';
        return;
      }

      // Plate summary
      selPlates.forEach(p => {
        const li = document.createElement('li');
        li.className = 'px-4 py-2.5 flex justify-between items-center text-xs sm:text-sm';
        li.innerHTML = `<div class="flex items-center gap-2"><span>${p.icon}</span><span class="font-bold text-slate-700">${esc(p.name)}</span><span class="text-slate-400 text-xs">($${p.price})</span></div>
          <div class="flex items-center gap-3"><span class="font-semibold text-slate-500">x ${p.count}</span><span class="font-bold text-slate-800 w-14 text-right">$${p.price * p.count}</span></div>`;
        list.appendChild(li);
      });

      // Dish breakdown (if any tracked)
      if (selDishes.length) {
        const hdr = document.createElement('li');
        hdr.className = 'px-4 py-1.5 bg-slate-50 text-[10px] font-bold text-slate-400 uppercase';
        hdr.textContent = '特別料理明細';
        list.appendChild(hdr);
        selDishes.forEach(d => {
          const tp = plates.find(p => p.id === d.plateId);
          const price = tp ? tp.price : 0;
          const li = document.createElement('li');
          li.className = 'px-4 py-2 flex justify-between items-center text-xs text-slate-500';
          li.innerHTML = `<div class="flex items-center gap-2"><span>${esc(d.icon)}</span><span>${esc(d.name)}</span></div>
            <div class="flex items-center gap-2"><span class="font-medium">x ${d.count} · $${price * d.count}</span><button type="button" class="su-dm w-6 h-6 rounded btn-soft-minus font-bold" aria-label="減少 ${esc(d.name)}">−</button></div>`;
          li.querySelector('.su-dm').onclick = () => { if (tp) { tp.count = Math.max(0, tp.count - 1); updatePlateUI(tp); } d.count = Math.max(0, d.count - 1); saveP(); saveD(); renderDishes(); calcAndSum(); };
          list.appendChild(li);
        });
      }
    }

    function renderSettings() {
      const cont = $('su-setlist'); cont.innerHTML = '';
      plates.forEach(p => {
        const d = document.createElement('div');
        d.className = 'flex items-center gap-2 bg-white p-2 rounded-xl border border-orange-100 text-xs';
        d.innerHTML = `
          <input type="text" value="${esc(p.icon || '🍣')}" class="w-8 px-1 py-1 text-center border border-slate-200 rounded-md bg-slate-50 outline-none" data-id="${p.id}" data-f="icon">
          <input type="text" value="${esc(p.name)}" class="flex-1 px-2 py-1 border border-slate-200 rounded-md font-medium text-slate-700 bg-slate-50 outline-none" data-id="${p.id}" data-f="name">
          <div class="flex items-center gap-1"><span class="text-slate-400">$</span><input type="number" min="0" value="${p.price}" inputmode="decimal" class="w-16 px-2 py-1 border border-slate-200 rounded-md font-bold text-slate-800 bg-slate-50 outline-none" data-id="${p.id}" data-f="price"></div>
          <button type="button" class="text-slate-300 hover:text-red-500 p-1" data-id="${p.id}" data-act="del" aria-label="刪除盤種"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>`;
        d.querySelectorAll('input').forEach(inp => {
          inp.onchange = () => {
            const pl = plates.find(x => x.id === inp.dataset.id);
            if (!pl) return;
            if (inp.dataset.f === 'icon') pl.icon = inp.value || '🍣';
            if (inp.dataset.f === 'name') pl.name = inp.value || '壽司盤';
            if (inp.dataset.f === 'price') pl.price = Math.max(0, parseFloat(inp.value) || 0);
            saveP(); renderGrid(); renderDishes(); calcAndSum();
          };
        });
        d.querySelector('[data-act="del"]').onclick = () => {
          if (plates.length <= 1) return;
          plates = plates.filter(x => x.id !== p.id);
          dishes = dishes.filter(x => x.plateId !== p.id); saveD();
          saveP(); renderGrid(); renderDishes(); renderSettings(); calcAndSum();
        };
        cont.appendChild(d);
      });
      if (window.lucide) lucide.createIcons();
    }

    function calc() {
      const sub = plates.reduce((s, p) => s + p.price * p.count, 0);
      const grand = svc ? sub * 1.1 : sub;
      txt('su-sub', sub);
      txt('su-grand', Math.round(grand).toLocaleString());
      $('su-extra').textContent = svc && sub > 0 ? '(已加 10% 服務費)' : '';
    }

    function calcAndSum() {
      calc();
      renderSum();
    }

    function refresh() {
      renderGrid(); renderDishes(); calcAndSum();
    }

    $('su-svc').onchange = e => { svc = e.target.checked; calc(); };
    $('su-edit').onclick = () => { $('su-settings').classList.toggle('hidden'); };
    $('su-addp').onclick = () => {
      plates.push({ id: Date.now().toString(), name: '新自訂盤', price: 20, icon: '🍱', color: 'bg-purple-500', count: 0 });
      saveP(); refresh(); renderSettings();
    };
    $('su-addd').onclick = () => $('su-dform').classList.toggle('hidden');
    $('su-dform').onsubmit = e => {
      e.preventDefault();
      const name = $('su-dname').value.trim();
      if (!name) return;
      dishes.push({ id: Date.now().toString(), name, plateId: $('su-dplate').value, icon: '🍣', count: 0 });
      saveD(); renderDishes(); $('su-dname').value = ''; $('su-dform').classList.add('hidden');
    };
    $('su-clear').onclick = () => {
      plates.forEach(p => p.count = 0);
      dishes.forEach(d => d.count = 0);
      saveP(); saveD(); refresh();
    };
    window.addEventListener('reset-calc', e => {
      if (e.detail.id === 'sushiro') {
        plates = JSON.parse(JSON.stringify(DEFAULT_PLATES));
        dishes = JSON.parse(JSON.stringify(DEFAULT_DISHES));
        svc = true; $('su-svc').checked = true;
        saveP(); saveD(); refresh(); renderSettings();
      }
    });

    refresh();
    renderSettings();
  }

  // ========== Boot ==========
  buildShell();
  [initBMI, initMortgage, initParty, initSupermarket, initSushiro].forEach(fn => {
    try { fn(); } catch (err) { console.error(fn.name, err); }
  });
  goTo(0, false);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registered', reg.scope))
        .catch(err => console.warn('SW registration failed', err));
    });
  }
})();
</script>
</body>
</html>
