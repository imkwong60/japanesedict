<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>日語深度學習助手</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide-react@0.468.0/dist/umd/lucide-react.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-in{animation:fadeIn .4s ease-out forwards}
body{margin:0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;
const Icon = ({name, size=20, className=""}) => {
  const icons = window.lucideReact || window.LucideReact || {};
  const Comp = icons[name];
  return Comp ? <Comp size={size} className={className}/> : <span className={className} aria-hidden="true">✦</span>;
};
const Search = p => <Icon name="Search" {...p}/>;
const BookOpen = p => <Icon name="BookOpen" {...p}/>;
const Layers = p => <Icon name="Layers" {...p}/>;
const Lightbulb = p => <Icon name="Lightbulb" {...p}/>;
const ArrowRight = p => <Icon name="ArrowRight" {...p}/>;
const Star = p => <Icon name="Star" {...p}/>;
const AlertCircle = p => <Icon name="AlertCircle" {...p}/>;
const Loader2 = p => <Icon name="LoaderCircle" {...p}/>;
const BookType = p => <Icon name="BookType" {...p}/>;
const Sparkles = p => <Icon name="Sparkles" {...p}/>;

const App = () => {
  const [query, setQuery] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  // 原始檔案中的 API 與 AI 邏輯保留不變
  const fetchWithRetry = async (url, options, retries = 5) => {
    const delays = [1000, 2000, 4000, 8000, 16000];
    for (let i = 0; i < retries; i++) {
      try {
        const res = await fetch(url, options);
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        return await res.json();
      } catch (err) {
        if (i === retries - 1) throw err;
        await new Promise(r => setTimeout(r, delays[i]));
      }
    }
  };

  const handleSearch = async (e) => {
    e.preventDefault();
    if (!query.trim()) return;
    setLoading(true); setError(''); setResult(null);
    const apiKey = 'AQ.Ab8RN6JAxQTjxw9Upu9wkuPajbIQYJ9giAR0KvzadmWAqCZHvA'; // 保留原始檔案中的 API Key 設定
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
    const payload = {
      contents: [{parts: [{text: `請詳細解釋這個日文生字或文法：「${query}」。請以繁體中文回答，並提供至少 5 個例句。`}]}],
      systemInstruction: {parts: [{text: "你是一個專業且具備母語水平的日文老師。請針對用戶輸入的日文字彙或文法，提供由淺入深的繁體中文解釋。要求結構：1. JLPT等級。2. 基本意思。3. 深入的語感、接續或使用場合解說。4. 至少 5 個實用例句（包含日文、平假名/羅馬音、中文翻譯）。5. 相似詞或相似文法的對比。6. 推薦下一個學習的關聯項目。必須嚴格輸出為指定的 JSON 格式。"}]},
      generationConfig: {
        responseMimeType: "application/json",
        responseSchema: {
          type: "OBJECT",
          properties: {
            level:{type:"STRING",description:"例如：N3, N4, N1"},
            type:{type:"STRING",description:"標註是「文法」還是「生字」"},
            basicMeaning:{type:"STRING",description:"最基本的中文翻譯與核心概念"},
            deepExplanation:{type:"STRING",description:"深入說明語感、接續方法、使用場合等細節"},
            examples:{type:"ARRAY",description:"至少 5 個例句",items:{type:"OBJECT",properties:{japanese:{type:"STRING"},reading:{type:"STRING"},chinese:{type:"STRING"}}}},
            comparisons:{type:"ARRAY",items:{type:"OBJECT",properties:{item:{type:"STRING"},explanation:{type:"STRING"}}}},
            nextSuggestions:{type:"ARRAY",items:{type:"OBJECT",properties:{item:{type:"STRING"},reason:{type:"STRING"}}}}
          },
          required:["level","type","basicMeaning","deepExplanation","examples","comparisons","nextSuggestions"]
        }
      }
    };
    try {
      const data = await fetchWithRetry(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (responseText) setResult(JSON.parse(responseText));
      else throw new Error("無法解析 AI 回應");
    } catch (err) {
      console.error(err); setError('分析過程中發生錯誤，請稍後再試或換一個詞彙。');
    } finally { setLoading(false); }
  };

  const getLevelColor = (level) => {
    if (!level) return "bg-gray-100 text-gray-700";
    const l = level.toUpperCase();
    if (l.includes("N1")) return "bg-red-100 text-red-800 border-red-200";
    if (l.includes("N2")) return "bg-orange-100 text-orange-800 border-orange-200";
    if (l.includes("N3")) return "bg-yellow-100 text-yellow-800 border-yellow-200";
    if (l.includes("N4")) return "bg-green-100 text-green-800 border-green-200";
    if (l.includes("N5")) return "bg-blue-100 text-blue-800 border-blue-200";
    return "bg-indigo-100 text-indigo-800 border-indigo-200";
  };

  return (
    <div className="min-h-screen bg-slate-50 font-sans text-slate-800 selection:bg-indigo-100">
      <header className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
          <div className="flex items-center space-x-2">
            <div className="bg-indigo-600 p-2 rounded-lg text-white"><BookType size={24}/></div>
            <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">日語深度學習助手</h1>
          </div>
          <div className="text-sm text-slate-500 hidden sm:block">Powered by AI</div>
        </div>
      </header>
      <main className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 mb-8 text-center transition-all hover:shadow-md">
          <h2 className="text-2xl font-bold text-slate-800 mb-2">你想學習什麼？</h2>
          <p className="text-slate-500 mb-6">輸入任何日文生字或文法（例如：
            <button className="text-indigo-600 hover:underline mx-1" onClick={()=>setQuery("わけがない")}>わけがない</button>、
            <button className="text-indigo-600 hover:underline mx-1" onClick={()=>setQuery("木漏れ日")}>木漏れ日</button>）
          </p>
          <form onSubmit={handleSearch} className="max-w-2xl mx-auto relative">
            <div className="relative flex items-center">
              <Search className="absolute left-4 text-slate-400" size={20}/>
              <input type="text" value={query} onChange={e=>setQuery(e.target.value)} placeholder="輸入日文生字或文法..." className="w-full pl-12 pr-32 py-4 rounded-xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-0 text-lg transition-colors outline-none bg-slate-50 focus:bg-white" disabled={loading}/>
              <button type="submit" disabled={loading||!query.trim()} className="absolute right-2 py-2 px-6 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-lg font-medium transition-colors flex items-center gap-2">
                {loading ? <Loader2 className="animate-spin" size={18}/> : '分析'}
              </button>
            </div>
          </form>
        </div>
        {error && <div className="mb-8 p-4 bg-red-50 border border-red-200 rounded-xl flex items-start gap-3 text-red-700 animate-fade-in"><AlertCircle className="shrink-0 mt-0.5" size={20}/><p>{error}</p></div>}
        {result && !loading && <div className="space-y-6 animate-fade-in pb-12">
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6"><div><div className="flex items-center gap-3 mb-2"><span className={`px-3 py-1 text-sm font-bold rounded-full border ${getLevelColor(result.level)}`}>JLPT {result.level}</span><span className="px-3 py-1 text-sm font-medium rounded-full bg-slate-100 text-slate-600 border border-slate-200">{result.type}</span></div><h2 className="text-3xl font-black text-slate-900">{query}</h2></div></div>
            <div className="grid md:grid-cols-2 gap-6 mt-6">
              <div className="bg-indigo-50 rounded-xl p-5 border border-indigo-100"><div className="flex items-center gap-2 text-indigo-800 font-bold mb-3"><Star size={18}/><h3>基本意思</h3></div><p className="text-slate-700 leading-relaxed text-lg font-medium">{result.basicMeaning}</p></div>
              <div className="bg-emerald-50 rounded-xl p-5 border border-emerald-100"><div className="flex items-center gap-2 text-emerald-800 font-bold mb-3"><Layers size={18}/><h3>深入解說 (語感/場合/接續)</h3></div><p className="text-slate-700 leading-relaxed">{result.deepExplanation}</p></div>
            </div>
          </div>
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8"><div className="flex items-center gap-2 text-slate-800 font-bold mb-6 text-xl border-b border-slate-100 pb-4"><BookOpen className="text-indigo-600" size={24}/><h2>實用例句</h2></div><div className="space-y-4">{result.examples.map((ex,idx)=><div key={idx} className="p-4 rounded-xl border border-slate-100 hover:border-indigo-100 hover:bg-indigo-50/30 transition-colors group"><div className="text-lg font-medium text-slate-900 mb-1">{ex.japanese}</div><div className="text-sm text-slate-500 font-mono mb-2">{ex.reading}</div><div className="text-slate-700 flex items-start gap-2"><span className="text-indigo-400 font-bold mt-0.5">中</span><span>{ex.chinese}</span></div></div>)}</div></div>
          {result.comparisons&&result.comparisons.length>0&&<div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8"><div className="flex items-center gap-2 text-slate-800 font-bold mb-6 text-xl border-b border-slate-100 pb-4"><Layers className="text-orange-500" size={24}/><h2>易混淆相似對比</h2></div><div className="grid sm:grid-cols-2 gap-4">{result.comparisons.map((comp,idx)=><div key={idx} className="bg-orange-50 rounded-xl p-5 border border-orange-100"><div className="font-bold text-orange-800 text-lg mb-2">{comp.item}</div><p className="text-slate-700 text-sm leading-relaxed">{comp.explanation}</p></div>)}</div></div>}
          {result.nextSuggestions&&result.nextSuggestions.length>0&&<div className="bg-gradient-to-br from-indigo-600 to-violet-700 rounded-2xl shadow-md p-6 sm:p-8 text-white"><div className="flex items-center gap-2 font-bold mb-6 text-xl border-b border-indigo-400/30 pb-4"><Lightbulb className="text-yellow-300" size={24}/><h2>下一步學習建議</h2></div><div className="grid sm:grid-cols-2 gap-4">{result.nextSuggestions.map((sugg,idx)=><div key={idx} className="bg-white/10 backdrop-blur-sm rounded-xl p-5 border border-white/20"><div className="flex items-center justify-between mb-2"><div className="font-bold text-xl text-yellow-100">{sugg.item}</div><button onClick={()=>{setQuery(sugg.item);window.scrollTo({top:0,behavior:'smooth'});}} className="p-1.5 hover:bg-white/20 rounded-lg transition-colors" title="立即學習"><ArrowRight size={18}/></button></div><p className="text-indigo-100 text-sm leading-relaxed">{sugg.reason}</p></div>)}</div></div>}
        </div>}
      </main>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
